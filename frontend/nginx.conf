server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
  gzip_min_length 1024;

  # Service worker: el navegador debe revisarlo siempre, nunca cachearlo,
  # o las actualizaciones de la PWA no llegarían a quienes ya la instalaron.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Bundle de Vite: cada archivo lleva el hash del contenido en el nombre,
  # así que un cache "para siempre" es seguro (un cambio real es otra URL).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fuentes autoalojadas: cambian casi nunca.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Modelos 3D de la previsualización. Pesan MB y llevan la versión en el
  # nombre (cuerpo-v1.glb), así que un cambio real es otra URL: cache eterno.
  location ~* \.(?:glb|gltf|obj)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Resto de estáticos (imágenes, iconos, manifest): cache corto y
  # revalidación por ETag, para no repetir la descarga en cada visita sin
  # arriesgar contenido viejo si se reemplaza el archivo.
  location ~* \.(?:webp|jpg|jpeg|png|svg|ico|webmanifest)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # Rutas del cliente (React Router): sin archivo real, cae a index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
