<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tattoo Estudio">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f929e" />
      <stop offset="0.38" stop-color="#eef3f6" />
      <stop offset="0.7" stop-color="#c3d2db" />
      <stop offset="1" stop-color="#6f828e" />
    </linearGradient>
    <linearGradient id="steel-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f717c" />
      <stop offset="0.4" stop-color="#aab6bf" />
      <stop offset="1" stop-color="#55666f" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9483b" />
      <stop offset="1" stop-color="#a82e24" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#07080a" />
    <g transform="rotate(45 256 256)">
      <!-- empuñadura -->
      <rect x="221" y="64" width="70" height="170" rx="14" fill="url(#steel)" />
      <g fill="#07080a" fill-opacity="0.32">
        <rect x="221" y="108" width="70" height="5" />
        <rect x="221" y="128" width="70" height="5" />
        <rect x="221" y="148" width="70" height="5" />
        <rect x="221" y="168" width="70" height="5" />
      </g>
      <!-- casquillo -->
      <rect x="209" y="232" width="94" height="26" rx="7" fill="url(#steel-dark)" />
      <!-- cono de transición y aguja -->
      <polygon points="234,258 278,258 263,304 249,304" fill="url(#steel)" />
      <polygon points="250,304 262,304 256,442" fill="#dbe5ea" />
    </g>
    <!-- gota de tinta bajo la punta -->
    <path d="M126 396 C126 396 104 424 104 438 a22 22 0 0 0 44 0 C148 424 126 396 126 396 Z" fill="url(#ink)" />
    <path d="M114 438 a12 12 0 0 0 7 11" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" />
</svg>
