# Blueprint de Render para el backend (plan gratuito, sin tarjeta).
#
# El frontend NO va aquí: se publica como sitio estático en Cloudflare Pages
# y la base de datos vive en Neon. Ver docs/despliegue.md.
#
# Las variables con `sync: false` las pide Render al crear el servicio y no se
# guardan en este archivo: así no hay secretos en el repositorio.
services:
  - type: web
    name: hector-tattoos-api
    runtime: docker
    plan: free
    # Ohio, para estar en la misma región que la base de Neon (us-east-2): la
    # latencia entre ambos pesa en cada consulta.
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      # Render fabrica un secreto aleatorio y lo guarda. El backend se niega a
      # arrancar en producción con uno corto o de ejemplo.
      - key: JWT_SECRET
        generateValue: true

      # Cadena de conexión de Neon (con ?sslmode=require).
      - key: DATABASE_URL
        sync: false

      # Dirección del frontend en Cloudflare Pages, sin barra final. La usa
      # CORS (quién puede llamar a la API) y el enlace del correo de
      # recuperación de contraseña.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Clave con la que el programador externo llama a /api/jobs/reminders (ver
      # docs/whatsapp-y-notificaciones.md). Render la genera; se lee en el panel.
      - key: CRON_SECRET
        generateValue: true

      # Las claves de las notificaciones push (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY) y
      # las de WhatsApp (WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID) NO van aquí: son
      # opcionales y, declaradas sin valor, Render podría pedirlas y frenar el
      # despliegue. Se agregan a mano en el panel (Environment).
      # Igual el WhatsApp vinculado (WHATSAPP_WEB_ENABLED, WHATSAPP_AUTH_KEY): es una
      # función no oficial que puede costarle a un artista su número, así que se
      # enciende a conciencia en el panel y no por defecto.

      # Registro abierto: cada artista crea su cuenta desde el login y solo ve sus
      # propios datos. OJO: cualquiera en internet puede registrarse y ocupar el
      # espacio de la base de Neon (0,5 GB) y de Cloudinary del plan gratis. Para
      # cerrarlo, "false" aquí y VITE_ALLOW_REGISTER=false en Cloudflare Pages.
      - key: ALLOW_REGISTER
        value: "true"

      # En la nube el disco se borra en cada despliegue: las imágenes van a
      # Cloudinary.
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: tatuajes/sketches
